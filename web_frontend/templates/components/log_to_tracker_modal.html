<!-- Modal: Log Analyzed Chat Dish to Tracker -->
<div id="log-to-tracker-modal" class="fixed inset-0 z-[95] flex items-center justify-center bg-stone-900/40 backdrop-blur-xs p-4 hidden" role="dialog" aria-modal="true" aria-labelledby="log-tracker-modal-title">
  <div class="relative w-full max-w-lg rounded-2xl bg-white p-6 shadow-2xl border border-stone-200/90 max-h-[92vh] overflow-y-auto">
    <div class="flex items-start justify-between gap-3 border-b border-stone-100 pb-3.5">
      <div>
        <span class="inline-flex items-center px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-800 text-[10px] font-bold tracking-wide uppercase border border-emerald-200 mb-1">Diet Diary</span>
        <h2 id="log-tracker-modal-title" class="font-serif text-2xl font-bold text-[#173c2c] m-0">Log Dish to Tracker</h2>
      </div>
      <button type="button" data-close-modal="log-to-tracker-modal" class="h-8 w-8 rounded-lg flex items-center justify-center text-stone-400 hover:text-stone-700 hover:bg-stone-100 transition cursor-pointer" aria-label="Close modal">✕</button>
    </div>

    <form id="log-to-tracker-form" class="mt-4 space-y-4">
      <input type="hidden" id="log-modal-conversation-id" name="conversation_id" value="">
      <input type="hidden" id="log-modal-message-id" name="message_id" value="">

      <div>
        <label for="log-modal-meal-title" class="block text-xs font-bold text-stone-800 mb-1">Meal / Dish Title</label>
        <input id="log-modal-meal-title" name="meal_title" type="text" required class="w-full px-3.5 py-2.5 rounded-xl border border-stone-200 bg-stone-50/50 text-sm text-stone-900 focus:outline-none focus:ring-2 focus:ring-[#245c43]/20 focus:border-[#245c43] transition">
      </div>

      <!-- Preview macro badges -->
      <div>
        <p class="text-[10px] font-bold uppercase tracking-wider text-stone-500 mb-1.5">Estimated Nutrients</p>
        <div id="log-modal-macros-preview" class="flex flex-wrap gap-1.5">
          <!-- Populated by PyScript open_chat_log_modal -->
        </div>
      </div>

      <!-- Meal Category: Breakfast / Lunch / Snacks / Dinner -->
      <div>
        <p class="text-xs font-bold text-stone-800 mb-2">Meal Category</p>
        <div class="grid grid-cols-2 gap-2 sm:grid-cols-4">
          <label class="modal-cat-card flex items-center justify-center p-2.5 rounded-xl border border-stone-200 cursor-pointer hover:bg-stone-50 transition has-[:checked]:bg-emerald-50 has-[:checked]:border-emerald-600 has-[:checked]:text-emerald-900">
            <input type="radio" id="log-modal-cat-breakfast" name="log_modal_category" value="breakfast" class="sr-only">
            <span class="text-xs font-semibold">Breakfast</span>
          </label>
          <label class="modal-cat-card flex items-center justify-center p-2.5 rounded-xl border border-stone-200 cursor-pointer hover:bg-stone-50 transition has-[:checked]:bg-emerald-50 has-[:checked]:border-emerald-600 has-[:checked]:text-emerald-900">
            <input type="radio" id="log-modal-cat-lunch" name="log_modal_category" value="lunch" class="sr-only">
            <span class="text-xs font-semibold">Lunch</span>
          </label>
          <label class="modal-cat-card flex items-center justify-center p-2.5 rounded-xl border border-stone-200 cursor-pointer hover:bg-stone-50 transition has-[:checked]:bg-emerald-50 has-[:checked]:border-emerald-600 has-[:checked]:text-emerald-900">
            <input type="radio" id="log-modal-cat-snacks" name="log_modal_category" value="snacks" class="sr-only">
            <span class="text-xs font-semibold">Snacks</span>
          </label>
          <label class="modal-cat-card flex items-center justify-center p-2.5 rounded-xl border border-stone-200 cursor-pointer hover:bg-stone-50 transition has-[:checked]:bg-emerald-50 has-[:checked]:border-emerald-600 has-[:checked]:text-emerald-900">
            <input type="radio" id="log-modal-cat-dinner" name="log_modal_category" value="dinner" class="sr-only">
            <span class="text-xs font-semibold">Dinner</span>
          </label>
        </div>
      </div>

      <!-- Time option: Now or Custom -->
      <div>
        <p class="text-xs font-bold text-stone-800 mb-1.5">Consumption Time</p>
        <div class="grid grid-cols-2 gap-2 mb-2">
          <label class="modal-time-card flex items-center justify-center p-2.5 rounded-xl border border-stone-200 cursor-pointer hover:bg-stone-50 transition has-[:checked]:bg-emerald-50 has-[:checked]:border-emerald-600">
            <input type="radio" id="log-modal-time-now" name="log_modal_time_option" value="now" checked class="sr-only">
            <span class="text-xs font-bold text-stone-800">Right Now</span>
          </label>
          <label class="modal-time-card flex items-center justify-center p-2.5 rounded-xl border border-stone-200 cursor-pointer hover:bg-stone-50 transition has-[:checked]:bg-emerald-50 has-[:checked]:border-emerald-600">
            <input type="radio" id="log-modal-time-custom" name="log_modal_time_option" value="custom" class="sr-only">
            <span class="text-xs font-bold text-stone-800">Custom Time</span>
          </label>
        </div>
        <div id="log-modal-custom-time-container" class="hidden">
          <input id="log-modal-custom-datetime" name="consumed_at" type="datetime-local" class="w-full px-3 py-2 rounded-xl border border-stone-200 text-xs bg-stone-50/50">
        </div>
      </div>

      <div id="log-modal-feedback" class="hidden rounded-xl p-3 text-xs"></div>

      <div class="flex items-center justify-end gap-2.5 pt-3 border-t border-stone-100">
        <button type="button" data-close-modal="log-to-tracker-modal" class="px-4 py-2 text-xs font-semibold text-stone-600 bg-stone-100 hover:bg-stone-200 rounded-xl transition cursor-pointer">Cancel</button>
        <button type="submit" id="log-modal-submit-btn" class="px-5 py-2 text-xs font-bold text-white bg-[#245c43] hover:bg-[#173c2c] rounded-xl shadow-xs transition cursor-pointer flex items-center gap-1.5">
          <span>Log to Tracker</span>
          <span>→</span>
        </button>
      </div>
    </form>
  </div>
</div>
