<form class="composer-box rounded-[24px] border border-[#dce2da] bg-white p-2.5 sm:p-3" id="chat-form" hx-preserve="true" action="/analyze/fragment" method="post" hx-post="/analyze/fragment" hx-encoding="multipart/form-data" hx-target="#conversation-content" hx-swap="beforeend" enctype="multipart/form-data">
  <textarea id="meal-description" class="block max-h-36 min-h-12 w-full resize-none border-0 bg-transparent px-3 py-2.5 text-[14px] leading-relaxed outline-none placeholder:text-[#929b94] focus:outline-none" name="text" rows="1" placeholder="Message NutriGuide"></textarea>
  <div class="flex items-center gap-1 px-1 pb-1">
    <input id="meal-image" name="image" type="file" accept="image/jpeg,image/png,image/webp" class="hidden">
    <input id="voice-upload" name="voice" type="file" accept="audio/wav,audio/mpeg" class="hidden">
    <button class="icon-button" id="attach-button" type="button" title="Add a photo" aria-label="Add a photo"><span class="text-[25px] leading-none">+</span></button>
    <span class="flex min-w-0 flex-1 flex-wrap gap-1 px-1 text-[11px] text-[#748078]" id="attachment-label" aria-live="polite"></span>
    <span id="recording-status" class="recording-wave hidden items-center gap-[3px] px-2" role="status" aria-label="Recording audio"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
    <button class="icon-button" id="mic-button" type="button" title="Record a voice note" aria-label="Record a voice note"><span aria-hidden="true"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"/></svg></span></button>
    <button class="icon-button bg-[#245c43] text-white hover:bg-[#173c2c] hover:text-white disabled:cursor-wait disabled:opacity-50" id="send-button" type="submit" title="Send meal" aria-label="Send meal"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5m-7 7 7-7 7 7"/></svg></button>
  </div>
  <p id="composer-error" class="hidden px-3 pt-1 text-xs text-[#9d4534]" role="alert"></p>
  <input type="hidden" name="user_id" value="">
  <input type="hidden" name="owner_id" value="{{ owner_id }}">
  <input type="hidden" name="conversation_id" value="{{ conversation_id }}">
</form>
