<form class="rounded-2xl border border-stone-200/90 bg-white p-2.5 sm:p-3 shadow-sm focus-within:border-[#245c43] focus-within:ring-2 focus-within:ring-[#245c43]/15 transition" id="chat-form" hx-preserve="true" action="/analyze/fragment" method="post" hx-post="/analyze/fragment" hx-encoding="multipart/form-data" hx-target="#conversation-content" hx-swap="beforeend" enctype="multipart/form-data">
  <textarea id="meal-description" class="block max-h-36 min-h-12 w-full resize-none border-0 bg-transparent px-3 py-2 text-sm leading-relaxed text-stone-900 outline-none placeholder:text-stone-400 focus:outline-none" name="text" rows="1" placeholder="Message NutriGuide (e.g., 2 roti with dal and salad, or snap a photo)…"></textarea>
  <div class="flex items-center gap-1.5 px-1 pt-1">
    <input id="meal-image" name="image" type="file" accept="image/jpeg,image/png,image/webp" class="hidden">
    <input id="voice-upload" name="voice" type="file" accept="audio/wav,audio/mpeg" class="hidden">
    
    <button class="h-9 w-9 rounded-xl flex items-center justify-center text-stone-500 hover:text-emerald-800 hover:bg-emerald-50 transition cursor-pointer" id="attach-button" type="button" title="Add a photo" aria-label="Add a photo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
    </button>

    <span class="flex min-w-0 flex-1 flex-wrap gap-1 px-1 text-xs text-stone-600" id="attachment-label" aria-live="polite"></span>
    
    <span id="recording-status" class="hidden items-center gap-1 px-2.5 py-1 rounded-full bg-red-50 border border-red-200 text-xs font-semibold text-red-600 animate-pulse" role="status" aria-label="Recording audio">
      <span class="h-2 w-2 rounded-full bg-red-500"></span>
      <span>Recording… click to attach</span>
    </span>

    <button class="h-9 w-9 rounded-xl flex items-center justify-center text-stone-500 hover:text-emerald-800 hover:bg-emerald-50 transition cursor-pointer" id="mic-button" type="button" title="Record a voice note" aria-label="Record a voice note">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"/></svg>
    </button>

    <button class="h-9 w-9 rounded-xl flex items-center justify-center bg-[#245c43] hover:bg-[#173c2c] text-white shadow-xs transition cursor-pointer disabled:opacity-50 disabled:cursor-wait" id="send-button" type="submit" title="Send meal" aria-label="Send meal">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5m-7 7 7-7 7 7"/></svg>
    </button>
  </div>
  <p id="composer-error" class="hidden px-3 pt-2 text-xs text-red-600 font-medium" role="alert"></p>
  <input type="hidden" name="user_id" value="">
  <input type="hidden" name="owner_id" value="{{ owner_id }}">
  <input type="hidden" name="conversation_id" value="{{ conversation_id }}">
</form>
