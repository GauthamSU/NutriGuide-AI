<!-- Universal Confirmation Modal for Delete Actions -->
<div id="confirm-delete-modal" class="fixed inset-0 z-[100] flex items-center justify-center bg-stone-900/40 backdrop-blur-xs p-4 hidden" role="dialog" aria-modal="true" aria-labelledby="confirm-delete-title">
  <div class="relative w-full max-w-md rounded-2xl bg-white p-6 shadow-2xl border border-stone-200/90 transition-all">
    <div class="flex items-start gap-3.5 mb-3">
      <div class="flex h-10 w-10 flex-none items-center justify-center rounded-xl bg-red-100 text-red-600 shadow-xs">
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
      </div>
      <div class="flex-1 min-w-0">
        <h3 id="confirm-delete-title" class="text-base font-bold text-stone-900 leading-snug">Confirm Deletion</h3>
        <p id="confirm-delete-message" class="text-xs text-stone-600 mt-1 leading-relaxed">
          Are you sure you want to delete this item? This action cannot be undone.
        </p>
      </div>
    </div>
    <div class="flex items-center justify-end gap-2.5 pt-4 mt-3 border-t border-stone-100">
      <button type="button" id="confirm-delete-cancel-btn" data-close-modal="confirm-delete-modal" class="px-4 py-2 text-xs font-semibold text-stone-700 bg-stone-100 hover:bg-stone-200 rounded-xl transition cursor-pointer">
        Cancel
      </button>
      <button type="button" id="confirm-delete-proceed-btn" class="px-4 py-2 text-xs font-bold text-white bg-red-600 hover:bg-red-700 rounded-xl shadow-xs transition cursor-pointer flex items-center gap-1.5">
        <span>Yes, Delete</span>
      </button>
    </div>
  </div>
</div>
